  :root{
    --turf-deep:#0A3B2C;--turf:#124B39;--parch:#F5F1E7;--parch-2:#E9E2D0;--ink:#0F1A14;--muted:#5F6E66;
    --water:#1394AC;--water-deep:#0C566A;--gold:#E7A828;--good:#1F9257;--penalty:#C4402B;
    --cond:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
    --line:#DED6C4;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:var(--body);background:linear-gradient(180deg,#0A3B2C,#06251b);min-height:100vh;
    display:flex;justify-content:center;align-items:flex-start;padding:14px;-webkit-font-smoothing:antialiased}
  /* phone frame */
  .phone{width:100%;max-width:400px;background:var(--parch);border-radius:26px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.4);min-height:88vh;display:flex;flex-direction:column;position:relative}
  /* ===== sponsor inventory ===== */
  .sponsorbar{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
    padding:7px 12px;display:flex;align-items:center;justify-content:center;gap:9px;min-height:38px}
  .sponsorbar .sl{font-family:var(--cond);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .sponsorbar .slot{height:22px;min-width:104px;border:1px dashed var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-family:var(--cond);
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9aa8a1;background:#fbf9f4}
  .adcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;text-align:center}
  .adcard .sl{font-family:var(--cond);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
  .adcard .slot{height:66px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-family:var(--cond);font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:#9aa8a1;background:#fbf9f4}
  .adrail{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;
    display:flex;align-items:center;gap:10px}
  .adrail .slot{flex:1;height:40px;border:1px dashed var(--line);border-radius:6px;display:flex;
    align-items:center;justify-content:center;font-family:var(--cond);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:#9aa8a1;background:#fbf9f4}
  .hdr{background:var(--turf-deep);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .hdr .k{font-family:var(--cond);letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#8FE3C4}
  .hdr h1{font-family:var(--cond);font-size:19px;margin:0;font-weight:700}
  .hdr .day{font-family:var(--cond);font-size:12px;color:#B7C9C0}
  .body{flex:1;overflow-y:auto;padding:18px}
  .body::-webkit-scrollbar{width:0}

  h2{font-family:var(--cond);font-size:23px;margin:0 0 4px;color:var(--ink)}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.45}
  .frame-note{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#7fae9b;font-size:11px}

  .btn{font-family:var(--cond);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:16px;
    padding:15px 18px;border-radius:14px;border:0;cursor:pointer;width:100%;transition:.12s}
  .btn.primary{background:var(--gold);color:#0A3B2C}.btn.primary:active{transform:scale(.98)}
  .btn.primary:disabled{opacity:.4}
  .btn.water{background:var(--water);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.sm{font-size:13px;padding:11px 14px;width:auto}
  .btnrow{display:flex;gap:10px;margin-top:16px}

  input[type=text]{font-size:17px;padding:14px;border-radius:12px;border:1.5px solid var(--line);width:100%;background:#fff;font-family:var(--body)}
  input:focus{outline:2px solid var(--water)}

  /* instructions */
  .rules-hook{background:var(--turf-deep);color:#fff;border-radius:14px;padding:14px 16px;text-align:center;margin-bottom:16px}
  .rules-hook b{font-family:var(--cond);font-size:19px;color:var(--gold);display:block;letter-spacing:.01em}
  .rules-hook span{font-size:13px;color:#cfeadf}
  .rule{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .rule .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--water);color:#fff;font-family:var(--cond);font-weight:700;display:grid;place-items:center;font-size:14px}
  .rule .t{font-size:13.5px;line-height:1.45}.rule .t b{font-family:var(--cond);font-size:15px;letter-spacing:.01em}
  .closer{text-align:center;font-style:italic;color:var(--muted);font-size:12.5px;margin:16px 0 4px;line-height:1.5}

  /* stepper dots */
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.dot.on{background:var(--water);width:22px;border-radius:5px}

  /* chips / picks */
  .ghd{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;color:var(--water-deep);margin:16px 0 8px;display:flex;justify-content:space-between}
  .ghd .p{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:13px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;flex:1 1 auto;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
  .chip.lock{background:var(--gold);border-color:var(--gold);color:#0A3B2C}
  .chip:disabled{opacity:.4}
  .fieldopt{margin-top:14px;border:1.5px dashed var(--water);border-radius:13px;padding:14px;background:#eaf7fa}
  .fieldopt.sel{background:var(--water);color:#fff;border-style:solid}
  .fieldopt b{font-family:var(--cond)}

  .slots{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
  .slot{flex:1 1 30%;font-family:var(--cond);font-size:12px;border:1.5px dashed var(--line);border-radius:11px;padding:10px;color:var(--muted);text-align:center;min-height:52px;display:flex;flex-direction:column;justify-content:center}
  .slot.full{border-style:solid;border-color:var(--water);color:var(--ink);background:#fff}
  .slot .r{font-size:10px;color:var(--water-deep);text-transform:uppercase;font-weight:700}

  .guess{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0}
  .guess button{font-family:var(--cond);font-size:30px;width:56px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff}
  .guess .v{font-family:var(--cond);font-size:52px;font-weight:700;min-width:96px;text-align:center;line-height:1}
  .guess .v small{font-size:13px;color:var(--muted);display:block}

  .review .rl{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
  .review .rl:first-child{border-top:0}.review .rl b{font-family:var(--cond);text-align:right}

  /* ===== WATCH glance ===== */
  .glance{background:linear-gradient(160deg,#fff,#f3eddd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .glance .lbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
  .glance .big{font-family:var(--cond);font-size:64px;font-weight:700;line-height:.9;color:var(--ink);letter-spacing:.01em}
  .glance .big small{font-size:16px;color:var(--muted)}
  .glance .rank{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
  .glance .rankn{font-family:var(--cond);font-size:26px;font-weight:700;color:var(--water-deep)}
  .glance .rankn small{font-size:13px;color:var(--muted);font-weight:500}
  .alert{background:var(--turf-deep);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:center;animation:pop .3s}
  @keyframes pop{from{transform:translateY(-6px);opacity:0}}
  .alert.pen{background:var(--penalty)}.alert.good{background:var(--good)}
  .alert b{font-family:var(--cond)}

  .sectionband{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--water-deep);text-align:center;margin:2px 0 12px}

  /* WBN card */
  .wbn{background:#fff;border-radius:16px;padding:16px;border:2px solid var(--water);box-shadow:0 6px 18px rgba(19,148,172,.18)}
  .wbn .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .wbn .badge{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#fff;background:var(--water);padding:3px 8px;border-radius:6px}
  .wbn .cd{font-family:var(--cond);font-weight:700;color:var(--water-deep)}
  .wbn h3{font-family:var(--cond);font-size:20px;margin:6px 0 2px}
  .wbn p{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .wbn .opts{display:flex;flex-direction:column;gap:8px}
  .wbn .opt{padding:13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:14px;text-align:left;cursor:pointer;font-weight:600}
  .wbn .opt.right{background:#e7f6ee;border-color:var(--good);color:var(--good)}
  .wbn .opt.wrong{background:#fbeae6;border-color:var(--penalty);color:var(--penalty)}
  .wbn .res{text-align:center;font-family:var(--cond);font-size:18px;margin-top:12px}

  /* Bear trap */
  .trap{background:linear-gradient(160deg,var(--water-deep),#07323f);color:#eafcff;border-radius:16px;padding:18px;text-align:center}
  .trap .lbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#8fe0ef}
  .trap h3{font-family:var(--cond);font-size:26px;margin:6px 0 12px}
  .trapholes{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
  .th{flex:1;background:rgba(255,255,255,.08);border-radius:11px;padding:10px 4px}
  .th .h{font-family:var(--cond);font-size:11px;color:#8fe0ef;letter-spacing:.05em}
  .th .s{font-family:var(--cond);font-size:30px;font-weight:700;line-height:1;margin-top:2px}
  .th.water .s{color:#ff8b6b}.th.splash{animation:splash .5s}
  @keyframes splash{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}}
  .trap .verdict{font-family:var(--cond);font-size:22px;font-weight:700}

  /* leaderboard rows */
  .lbrow{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:11px 8px;border-radius:11px}
  .lbrow+.lbrow{margin-top:3px}
  .lbrow.you{background:#fff;box-shadow:inset 0 0 0 2px var(--water)}
  .lbrow.win{background:#fdf6e6}
  .lbrow .p{font-family:var(--cond);font-size:17px;font-weight:700;text-align:center}.lbrow .p .l{color:var(--gold)}
  .lbrow .nm{font-weight:600;font-size:14px}.lbrow .nm .s{font-size:11px;color:var(--muted);font-weight:500;display:block}
  .lbrow .sc{font-family:var(--cond);font-size:22px;font-weight:700}

  /* team breakdown */
  .con{border-top:1px solid var(--line);padding:11px 4px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
  .con:first-child{border-top:0}.con .cn{font-weight:600;font-size:13.5px}.con .cs{font-size:11.5px;color:var(--muted);margin-top:1px}
  .con .cv{font-family:var(--cond);font-size:20px;font-weight:700}
  .con .cv.good{color:var(--good)}.con .cv.bad{color:var(--penalty)}.con .cv.pend{color:var(--muted)}
  .con .evs{margin-top:5px;display:flex;flex-direction:column;gap:2px}
  .con .ev{font-size:11.5px;color:#556;display:flex;justify-content:space-between;gap:8px}
  .con .ev .d{font-family:var(--cond);font-weight:700}.con .ev .d.good{color:var(--good)}.con .ev .d.bad{color:var(--penalty)}

  /* 19th */
  .final-hero{background:linear-gradient(160deg,var(--turf-deep),#06281d);color:#fff;border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:14px}
  .final-hero .l{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#8FE3C4}
  .final-hero .n{font-family:var(--cond);font-size:70px;font-weight:700;line-height:.9}
  .final-hero .r{font-family:var(--cond);font-size:20px;color:var(--gold);margin-top:4px}
  .champ{background:linear-gradient(160deg,#fff,#f7efd8);border-radius:16px;padding:16px;margin-top:14px;border:1.5px solid var(--gold)}
  .champ .tt{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--gold)}
  .champ .subt{font-size:12px;color:var(--muted);margin:2px 0 10px}
  .ribbon{display:inline-block;font-family:var(--cond);font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--gold);color:#0A3B2C;padding:2px 7px;border-radius:5px;font-weight:700;margin-left:6px}

  /* tab bar */
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--parch)}
  .tabbar button{flex:1;background:transparent;border:0;padding:11px 4px 13px;font-family:var(--cond);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer}
  .tabbar button .i{display:block;font-size:18px;margin-bottom:2px}
  .tabbar button[aria-selected="true"]{color:var(--water-deep);font-weight:700}
  .hidden{display:none!important}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
  .pill2{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px}
  .pill2 b{font-family:var(--cond)}.pill2 .rl{color:var(--water-deep);font-weight:700;font-size:9.5px;text-transform:uppercase}

  /* title */
  .title{text-align:center;padding:6px 4px 10px}
  .title .hero{width:100%;border-radius:16px;display:block;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
  .title .ttl-sub{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .tsponsors .slbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:#9aa89f;margin-bottom:7px}
  .tsponsors .logos{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .lchip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-family:var(--cond);font-weight:700;font-size:15px;line-height:1;color:var(--ink);letter-spacing:.02em}
  .lchip span{font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .lchip.cog{color:#003b71}.lchip.sp1{color:#0d7d5a}.lchip.sp2{color:#8a5a12}
  .phold{font-size:9.5px;color:#b3bcb2;margin-top:8px;font-style:italic}
  .hdr{gap:12px}
  .hbadge{width:38px;height:38px;border-radius:50%;margin-right:2px}
  /* live meter */
  .meter{background:#fff;border-radius:14px;padding:6px 10px 8px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:12px}
  .mhd{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--muted);padding:8px 2px 6px}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
  .mrow.trapon{background:linear-gradient(90deg,#e6f6fb,#fff);border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--water)}
  .mn{font-weight:600;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .mr{text-align:right;white-space:nowrap}
  .mr .tp{font-family:var(--cond);font-size:24px;font-weight:700}
  .mr .tp.under{color:var(--good)}.mr .tp.over{color:var(--penalty)}.mr .tp.ev{color:var(--ink)}
  .mr .thru{display:block;font-size:10.5px;color:var(--muted);font-family:var(--cond);letter-spacing:.05em}
  .mr .tee{font-family:var(--cond);font-size:15px;color:var(--water-deep);font-weight:600}
  .mtag{font-family:var(--cond);font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;font-weight:700}
  .mtag.skins{background:#fdf3d6;color:#8a6b12}.mtag.trap{background:#e3f6fb;color:var(--water-deep)}
  .mtrap{display:flex;gap:5px;width:100%;margin-top:5px}
  .mtrap span{font-family:var(--cond);font-weight:700;font-size:15px;background:#eef3f1;border-radius:6px;padding:3px 9px;color:var(--ink)}
  .mtrap span.w{background:#fbe7e0;color:var(--penalty)}.mtrap span.pend{color:#c3ccC4;background:#f2f0e9}


  /* installed / standalone: fill the screen, respect notch */
  @media (display-mode: standalone), (display-mode: fullscreen){
    body{padding:0;align-items:stretch;background:var(--turf-deep)}
    .phone{max-width:100%;min-height:100vh;border-radius:0;box-shadow:none}
    .hdr{padding-top:calc(14px + env(safe-area-inset-top))}
    .tabbar{padding-bottom:env(safe-area-inset-bottom)}
    .frame-note{display:none}
  }
  @supports(-webkit-touch-callout:none){ .body{-webkit-overflow-scrolling:touch} }
  button,.chip,.opt{-webkit-tap-highlight-color:transparent;touch-action:manipulation}


  /* ===== v5: cover + rules ===== */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  @keyframes sweep{0%{background-position:-180% 0}100%{background-position:180% 0}}
  @keyframes tick{0%,45%{transform:translateY(0)}50%,95%{transform:translateY(-100%)}100%{transform:translateY(-100%)}}
  .rise{opacity:0;animation:rise .5s ease-out forwards}

  .cover{padding:2px 2px 8px;text-align:center}
  .livebar{display:flex;align-items:center;justify-content:center;gap:7px;background:#0d4a37;color:#bff0d9;
    border-radius:999px;padding:6px 12px;font-family:var(--cond);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:14px}
  .livedot{width:7px;height:7px;border-radius:50%;background:#48e39b;animation:blip 1.4s infinite}
  .welcome{font-family:var(--cond);text-transform:uppercase;letter-spacing:.22em;font-size:11.5px;color:var(--muted)}
  .wordmark{display:flex;align-items:center;justify-content:center;gap:11px;margin:6px 0 2px}
  .wordmark img{width:52px;height:52px;border-radius:50%;flex:0 0 52px}
  .wordmark .wm{text-align:left}
  .wordmark .wm b{display:block;font-family:var(--cond);font-size:27px;font-weight:700;line-height:.94;color:var(--ink);letter-spacing:.01em}
  .wordmark .wm i{font-style:normal;font-family:var(--cond);font-size:20px;color:var(--water-deep);letter-spacing:.04em}
  .tagline{font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;
    color:#fff;background:var(--water);border-radius:8px;padding:6px 12px;display:inline-block;margin:10px 0 16px}

  .sells{display:flex;flex-direction:column;gap:7px;text-align:left;margin-bottom:15px}
  .sell{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;opacity:0;animation:rise .45s ease-out forwards}
  .sell .ic{flex:0 0 30px;height:30px;border-radius:9px;background:#eaf7fa;display:grid;place-items:center;font-size:16px}
  .sell .tx{font-size:12.8px;line-height:1.35}
  .sell .tx b{font-family:var(--cond);font-size:14.5px;letter-spacing:.02em;display:block;color:var(--ink)}
  .sell .tx span{color:var(--muted)}
  .sell.hot{border-color:var(--gold);background:linear-gradient(100deg,#fffdf5,#fff)}
  .sell.hot .ic{background:#fdf1d6}

  .creds{border-top:1px solid var(--line);padding-top:13px;margin-top:2px}
  .creds .cl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:9.5px;color:#9aa89f;margin-bottom:6px}
  .creds .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .mk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:var(--cond);
    font-weight:700;font-size:12px;line-height:1.05;color:var(--ink);letter-spacing:.02em}
  .mk span{display:block;font-size:8px;letter-spacing:.13em;color:var(--muted);font-weight:600}
  .mk.cog{color:#00427a}.mk.pga{color:#0b3a6b}.mk.jn{color:#0d7d5a}.mk.s1{color:#8a5a12}.mk.s2{color:#6b4b8a}
  .illus{font-size:9px;color:#b3bcb2;font-style:italic;margin-top:-4px}

  .cta{position:relative;overflow:hidden}
  .cta:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
    background-size:220% 100%;animation:sweep 2.6s infinite}
  .ctasub{font-size:11px;color:var(--muted);margin-top:7px}

  /* rules page */
  .rhead{background:linear-gradient(150deg,var(--turf-deep),#0d5540);color:#fff;border-radius:15px;padding:16px;margin-bottom:13px;text-align:center}
  .rhead h2{color:#fff;font-size:21px;margin:0 0 3px;line-height:1.05}
  .rhead .rs{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:#8FE3C4}
  .rhead .need{font-size:12px;color:#cfeadf;margin-top:8px;border-top:1px solid rgba(255,255,255,.16);padding-top:9px}
  .mathstrip{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:11px;margin-bottom:13px;font-family:var(--cond)}
  .mathstrip .b{font-size:26px;font-weight:700;color:var(--ink)}
  .mathstrip .ar{color:var(--muted);font-size:15px}
  .mathstrip .off{font-size:13px;color:var(--good);font-weight:700}
  .mathstrip .fin{font-size:26px;font-weight:700;color:var(--water-deep)}
  .mathstrip .cap{font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;text-align:center;font-weight:600}

  .rcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;
    display:flex;gap:11px;opacity:0;animation:rise .45s ease-out forwards}
  .rcard .rn{flex:0 0 34px;height:34px;border-radius:10px;background:var(--water);color:#fff;display:grid;place-items:center;font-size:17px}
  .rcard .rb{flex:1}
  .rcard .rt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .rcard .rt b{font-family:var(--cond);font-size:16px;letter-spacing:.02em}
  .rcard .val{font-family:var(--cond);font-size:12px;font-weight:700;background:#eaf7fa;color:var(--water-deep);
    border-radius:6px;padding:2px 7px;white-space:nowrap}
  .rcard .val.pen{background:#fbeae6;color:var(--penalty)}
  .rcard p{margin:0;font-size:12.5px;line-height:1.42;color:#4a5852}
  .rcard.trap{border-color:var(--water);background:linear-gradient(120deg,#f2fbfd,#fff)}
  .rcard.trap .rn{background:var(--water-deep)}
  .rcard.live .rn{background:var(--gold);color:#0A3B2C}


  /* ===== v6: desktop stage ===== */
  .stage{display:none}
  @media(min-width:1000px){
    body{align-items:center;gap:34px;padding:26px}
    .stage{display:block;width:290px;color:#fff;animation:rise .6s ease-out both}
    .stage.sr{animation-delay:.15s}
    .stage .sbadge{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .stage .sbadge img{width:46px;height:46px;border-radius:50%}
    .stage .sbadge b{font-family:var(--cond);font-size:22px;line-height:.95;display:block;letter-spacing:.01em}
    .stage .sbadge i{font-style:normal;font-family:var(--cond);font-size:16px;color:#8FE3C4;letter-spacing:.05em}
    .stage h3{font-family:var(--cond);font-size:31px;line-height:1.06;margin:0 0 10px;font-weight:700}
    .stage h3 em{font-style:normal;color:var(--gold)}
    .stage p.lede{font-size:13.5px;line-height:1.55;color:#B7D3C7;margin:0 0 16px}
    .stage ul{list-style:none;padding:0;margin:0}
    .stage li{font-size:13px;color:#D7E8DF;padding:7px 0 7px 24px;position:relative;border-top:1px solid rgba(255,255,255,.09)}
    .stage li:before{content:"✓";position:absolute;left:0;color:#48e39b;font-weight:700}
    .stage .kpi{display:flex;gap:8px;margin-top:16px}
    .stage .kpi div{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:11px;padding:10px 8px;text-align:center}
    .stage .kpi b{display:block;font-family:var(--cond);font-size:23px;color:#fff;line-height:1}
    .stage .kpi span{font-size:9.5px;color:#93b3a4;text-transform:uppercase;letter-spacing:.09em}
    .stage .charity{background:linear-gradient(150deg,rgba(231,168,40,.16),rgba(255,255,255,.04));
      border:1px solid rgba(231,168,40,.42);border-radius:14px;padding:14px;margin-bottom:14px}
    .stage .charity .ct{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--gold)}
    .stage .charity b{display:block;font-family:var(--cond);font-size:19px;margin:4px 0 5px;line-height:1.1}
    .stage .charity p{font-size:12px;color:#D7E8DF;margin:0;line-height:1.5}
    .stage .marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .stage .mk2{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:8px;
      padding:6px 9px;font-family:var(--cond);font-weight:700;font-size:11.5px;line-height:1.05;color:#fff}
    .stage .mk2 span{display:block;font-size:8px;letter-spacing:.12em;color:#93b3a4}
    .stage .foot2{font-size:10px;color:#7fae9b;margin-top:14px;font-style:italic;line-height:1.5}
  }
  /* ===== v6: cover hero band ===== */
  .heroband{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px}
  .heroband img{width:100%;display:block;filter:saturate(1.05)}
  .heroband .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,37,27,.24) 0%,rgba(6,37,27,.55) 55%,rgba(6,37,27,.94) 100%)}
  .heroband .hb{position:absolute;left:0;right:0;bottom:9px;text-align:center;color:#fff}
  .heroband .hb .wl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.2em;font-size:9.5px;color:#8FE3C4}
  .heroband .hb b{display:block;font-family:var(--cond);font-size:29px;line-height:.95;letter-spacing:.01em;margin:1px 0}
  .heroband .hb i{font-style:normal;font-family:var(--cond);font-size:15px;color:var(--gold);letter-spacing:.14em}
  .heroband .lv{position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:6px;background:rgba(6,37,27,.72);
    border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 9px;font-family:var(--cond);
    font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#bff0d9}
  .charityband{background:linear-gradient(120deg,#fff8e6,#fff);border:1.5px solid var(--gold);border-radius:13px;
    padding:11px 13px;display:flex;gap:10px;align-items:center;margin-bottom:11px;text-align:left}
  .charityband .ci{font-size:21px}
  .charityband b{font-family:var(--cond);font-size:15px;display:block;letter-spacing:.02em}
  .charityband span{font-size:11.5px;color:#6a5a34;line-height:1.35;display:block}
  .minirow{display:flex;gap:7px;margin-bottom:13px}
  .mini{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 8px;text-align:center}
  .mini b{display:block;font-family:var(--cond);font-size:12.5px;letter-spacing:.02em}
  .mini span{font-size:10px;color:var(--muted);line-height:1.3;display:block;margin-top:1px}


  /* v7 clean-badge hero */
  .bhero{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;padding:20px 14px 16px;text-align:center;
    background:radial-gradient(120% 90% at 50% 0%,#1a6b50 0%,#0d4433 55%,#082f23 100%)}
  .bhero:before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 2px,transparent 2px 9px)}
  .bhero .lv{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 9px;
    font-family:var(--cond);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#bff0d9}
  .bhero img{width:112px;height:112px;position:relative;filter:drop-shadow(0 6px 16px rgba(0,0,0,.42))}
  .bhero .wl{position:relative;font-family:var(--cond);text-transform:uppercase;letter-spacing:.2em;font-size:9.5px;color:#8FE3C4;margin-top:9px}
  .bhero b{position:relative;display:block;font-family:var(--cond);font-size:29px;line-height:.95;color:#fff;letter-spacing:.01em;margin:2px 0}
  .bhero i{position:relative;font-style:normal;font-family:var(--cond);font-size:15px;color:var(--gold);letter-spacing:.16em}


  /* v8: game icon chips in hero + top marks */
  .gchips{position:relative;display:flex;gap:5px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .gchip{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);border-radius:9px;
    padding:6px 8px 5px;min-width:60px;text-align:center;backdrop-filter:blur(2px)}
  .gchip span{display:block;font-size:17px;line-height:1.1}
  .gchip em{font-style:normal;display:block;font-family:var(--cond);font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;color:#a9e6cd;margin-top:1px}
  .topmarks{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
  .topmarks .mk{padding:5px 8px;font-size:10.5px}
  .topmarks .mk span{font-size:7px}
  .marklbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:8.5px;color:#9aa89f;margin-bottom:4px}


  /* v9: side-flanked game icons */
  .herorow{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:2px}
  .gside{display:flex;flex-direction:column;gap:6px}
  .gchip2{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);border-radius:10px;
    width:62px;padding:6px 3px 5px;text-align:center}
  .gchip2 span{display:block;font-size:18px;line-height:1.05}
  .gchip2 em{font-style:normal;display:block;font-family:var(--cond);font-size:8px;letter-spacing:.07em;
    text-transform:uppercase;color:#a9e6cd;margin-top:1px;line-height:1.15}
  .bhero .gcap{position:relative;font-family:var(--cond);text-transform:uppercase;letter-spacing:.13em;
    font-size:8.5px;color:#7fc9a9;margin-top:8px}
  /* QR block (desktop stage) */
  .qrbox{background:#fff;border-radius:14px;padding:12px;text-align:center;margin-top:14px}
  .qrbox img{width:118px;height:118px;display:block;margin:0 auto 7px}
  .qrbox b{display:block;font-family:var(--cond);font-size:14px;color:var(--ink);letter-spacing:.02em}
  .qrbox span{font-size:10.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}


  /* v10: labelled contest panel */
  .bhero img{width:96px;height:96px}
  .cbox{position:relative;margin-top:12px;background:rgba(0,0,0,.20);
    border:1px solid rgba(255,255,255,.20);border-radius:13px;padding:9px 9px 10px}
  .cbox .clegend{font-family:var(--cond);text-transform:uppercase;letter-spacing:.13em;font-size:9px;
    color:var(--gold);text-align:center;padding-bottom:7px;margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.15)}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cc{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:10px;
    padding:8px 7px;display:flex;gap:7px;align-items:center;text-align:left}
  .cc .ci2{font-size:17px;line-height:1;flex:0 0 auto}
  .cc .cw{min-width:0}
  .cc b{display:block;font-family:var(--cond);font-size:11.5px;color:#fff;letter-spacing:.02em;line-height:1.1}
  .cc em{font-style:normal;display:block;font-size:8.5px;color:#8fd9b8;line-height:1.25;margin-top:1px}


  .qrbox .qrimg{width:126px;height:126px;margin:0 auto 7px;display:block;image-rendering:pixelated}
  .qrbox .nourl{font-size:10.5px;color:var(--muted);line-height:1.4}
  /* phone-visible 'get this on your phone' helper */
  .getphone{background:#fff;border:1.5px dashed var(--water);border-radius:13px;padding:12px;text-align:center;margin-top:12px}
  .getphone b{font-family:var(--cond);font-size:14px;display:block;margin-bottom:3px}
  .getphone span{font-size:11.5px;color:var(--muted);line-height:1.4;display:block}
  .getphone .u{font-family:var(--cond);font-size:12.5px;color:var(--water-deep);word-break:break-all;margin-top:5px;display:block}


  /* v12 unify + numbered boxes + icons */
  .cov2{display:flex;flex-direction:column;gap:11px;text-align:center}
  .cov2>*{margin:0}
  .bhero .livepill{position:relative;display:inline-flex;align-items:center;gap:7px;margin:0 auto 12px;
    background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;
    font-family:var(--cond);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#bff0d9}
  .rcard .rn{position:relative}
  .rnum{position:absolute;top:-8px;left:-8px;width:19px;height:19px;border-radius:50%;background:var(--gold);
    color:#0A3B2C;font-family:var(--cond);font-weight:700;font-size:11px;display:grid;place-items:center;
    border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .rn svg{display:block}


  /* v13: hardened centering + bigger emoji icons */
  .bhero{display:flex;flex-direction:column;align-items:center}
  .bhero .livepill{align-self:center;margin:0 0 12px}
  .bhero img{width:104px;height:104px;margin:0 auto}
  .bhero .wl,.bhero b,.bhero i,.bhero .cbox{width:100%}
  .rcard .rn{font-size:21px}
  .rcard .rn.emo{font-size:22px;line-height:1}


  /* v14: per-box icon colors */
  .rcard .rn{background:#1F9257}
  .rcard.c2 .rn{background:#1394AC}
  .rcard.c3 .rn{background:#4C5FA8}
  .rcard.c4 .rn{background:#C8901E}
  .rcard.trap .rn{background:#0C566A}
  .rcard.live .rn{background:#D2593C}
  .rcard.c2{border-color:#bfe3ea}.rcard.c3{border-color:#ccd2ea}.rcard.c4{border-color:#eeddb4}
  .rcard.live{border-color:#f0cbc0;background:linear-gradient(120deg,#fff7f4,#fff)}


  /* v15: skills box colour */
  .rcard.c5 .rn{background:#7A4FA3}
  .rcard.c5{border-color:#dcd0ea}


  /* v16: unified full-colour icons on light tiles */
  .rcard .rn{background:#EAF3EE}
  .rcard.c2 .rn{background:#E6F4F8}
  .rcard.c3 .rn{background:#FBF3E2}
  .rcard.c5 .rn{background:#F0EAF7}
  .rcard.c4 .rn{background:#FBF1DA}
  .rcard.trap .rn{background:#F3EADF}
  .rcard.live .rn{background:#E6F2FA}
  .rcard .rn{width:38px;height:38px;flex:0 0 38px;border-radius:11px}
  .rnum{top:-7px;left:-7px}
  .cc .ci2{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.92);border-radius:8px;flex:0 0 26px}
  .cc .ci2 svg{width:20px;height:20px;display:block}


  /* v19: title can never be crushed by a long value chip */
  .rcard .rt{flex-wrap:wrap;align-items:baseline}
  .rcard .rt b{flex:1 1 auto;min-width:58%;line-height:1.15}
  .rcard .val{flex:0 0 auto;white-space:nowrap}


  /* v20: title on its own line, value chip beneath; version stamp */
  .rcard .rt{display:block}
  .rcard .rt b{display:block;font-size:16.5px;line-height:1.2;margin-bottom:3px}
  .rcard .val{display:inline-block;margin-bottom:4px}
  .vstamp{position:fixed;right:6px;bottom:6px;z-index:99;background:#E7A828;color:#0A3B2C;
    font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.08em;
    padding:3px 8px;border-radius:6px;opacity:.92}


  /* v21 FIX: the watch-screen .trap panel (white text, centred) was leaking onto the
     Bear Trap rule card, making its headline white-on-white. Re-assert card styling. */
  .rcard.trap{color:var(--ink);text-align:left;padding:12px;border-radius:13px;
    background:linear-gradient(120deg,#f2fbfd,#fff)}
  .rcard.trap .rt b{color:var(--ink)}
  .rcard.trap p{color:#4a5852}


  /* v22: single scroll on phones — kills the empty white run below the content */
  @media (max-width:700px){
    body{padding:0;align-items:stretch;background:var(--parch)}
    .phone{max-width:100%;min-height:100vh;border-radius:0;box-shadow:none}
    .body{overflow:visible;flex:1 0 auto;padding-bottom:18px}
    .tabbar{position:sticky;bottom:0;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
    .frame-note{display:none}
    .hdr{position:sticky;top:0;z-index:20}
  }


  /* v23: page height = content height on phones. No forced min-height anywhere,
     so there is nothing empty left to scroll into. */
  @media (max-width:700px){
    html,body{height:auto;overflow-x:hidden}
    body{display:block;padding:0;background:var(--parch)}
    .phone{display:block;min-height:0;max-width:100%;border-radius:0;box-shadow:none}
    .body{overflow:visible;flex:none;padding:18px 18px 16px}
    .stage{display:none!important}
    .frame-note{display:none!important}
    .tabbar{position:sticky;bottom:0}
  }


  /* v24 diagnostics */
  #endbar{background:#C4402B;color:#fff;font-family:var(--cond);font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;text-align:center;padding:10px;width:100%}
  .vstamp{font-size:10px;letter-spacing:.04em;max-width:92vw;text-align:right;line-height:1.25}


  /* v25: page is never a flex row. Phone is a normal centred block at every width;
     desktop side panels are absolutely positioned so they cannot add page height. */
  body{display:block!important;padding:0!important;position:relative}
  .phone{margin:0 auto!important}
  .stage{display:none!important}
  @media (min-width:1120px){
    .stage{display:block!important;position:absolute;top:26px;width:290px}
    .stage.sl{left:calc(50% - 500px)}
    .stage.sr{left:calc(50% + 210px)}
  }
  @media (max-width:700px){
    .phone{min-height:0;max-width:100%;border-radius:0;box-shadow:none}
  }


  /* v27: stop rubber-band overscroll revealing background past the end of the page,
     and make any area behind the page match the app instead of showing white. */
  html{background:var(--turf-deep);overscroll-behavior-y:none}
  body{overscroll-behavior-y:none;background:var(--turf-deep)}
  @media (max-width:700px){
    html,body{background:var(--parch)}
    .phone{min-height:100vh}
  }


/* ==================== v29: back-half restyle + app shell ==================== */
/* --- app shell: the document itself cannot scroll; only the content panel does.
       This removes rubber-band bounce structurally instead of discouraging it. --- */
@media (max-width:700px){
  html{height:100%;overflow:hidden}
  body{height:100%;overflow:hidden;position:fixed;inset:0;width:100%;background:var(--parch)}
  .phone{height:100%;min-height:0;display:flex;flex-direction:column;max-width:100%;border-radius:0;box-shadow:none;margin:0}
  .hdr{position:static;flex:0 0 auto}
  .body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;padding:18px 18px 26px}
  .tabbar{position:static;flex:0 0 auto}
}

/* --- shared screen furniture --- */
.shead{background:linear-gradient(150deg,var(--turf-deep),#0d5540);color:#fff;border-radius:15px;
  padding:15px 16px;margin-bottom:13px}
.shead .st{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:#8FE3C4}
.shead h2{color:#fff;font-size:21px;margin:2px 0 0;line-height:1.08}
.shead p{margin:6px 0 0;font-size:12.5px;color:#cfeadf;line-height:1.45}

/* stepper */
.steps2{display:flex;align-items:center;gap:5px;margin-bottom:13px}
.st2{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative}
.st2.done{background:var(--good)}
.st2.on{background:var(--gold)}
.steplbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:9.5px;
  color:var(--muted);text-align:right;margin:-8px 0 12px}

/* player chips */
.chips{gap:8px}
.chip{flex:1 1 46%;justify-content:flex-start;gap:9px;padding:11px 12px;border-radius:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);font-weight:600;min-height:48px;transition:.14s}
.chip .gb{flex:0 0 22px;height:22px;border-radius:7px;background:#EAF3EE;color:var(--water-deep);
  font-family:var(--cond);font-size:11px;font-weight:700;display:grid;place-items:center}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff;
  box-shadow:0 3px 10px rgba(19,148,172,.28)}
.chip[aria-pressed="true"] .gb{background:rgba(255,255,255,.22);color:#fff}
.chip.lock{background:linear-gradient(120deg,#fff6e2,#fffdf7);border-color:var(--gold);color:var(--ink)}
.chip.lock .gb{background:var(--gold);color:#0A3B2C}
.chip:disabled{opacity:.42;box-shadow:none}

/* team slots */
.slots{gap:6px;margin-bottom:10px}
.slot{flex:1 1 30%;border-radius:12px;padding:9px 6px;min-height:56px;font-size:11.5px;font-family:var(--body)}
.slot.full{box-shadow:0 2px 8px rgba(19,148,172,.14)}
.slot .r{font-family:var(--cond);letter-spacing:.08em;margin-bottom:2px}

/* guess stepper */
.guess{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin:4px 0 14px;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
.guess button{border-radius:13px;border:1.5px solid var(--line);background:var(--parch);font-size:26px;
  width:52px;height:52px;color:var(--ink)}
.guess button:active{background:var(--water);color:#fff;border-color:var(--water)}
.guess .v{font-size:46px;color:var(--water-deep)}
.guessnote{font-size:11.5px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.4}

/* jobs */
.jobcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.jobcard .jh{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.jobcard .ji{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center}
.jobcard .ji svg{width:20px;height:20px}
.jobcard .jt{font-family:var(--cond);font-size:15.5px;line-height:1.1}
.jobcard .jv{margin-left:auto;font-family:var(--cond);font-size:11.5px;font-weight:700;
  background:#eaf7fa;color:var(--water-deep);border-radius:6px;padding:2px 7px;white-space:nowrap}
.jobcard .jd{font-size:11.5px;color:var(--muted);margin:0 0 9px;line-height:1.4}

/* review */
.rev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.rev .rl{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.rev .rl:first-child{border-top:0}
.rev .rl span{color:var(--muted)}
.rev .rl b{font-family:var(--cond);font-size:14px;text-align:right}

/* ---- live screens ---- */
.glance{background:linear-gradient(155deg,var(--turf-deep),#0b4030);color:#fff;border-radius:17px;
  padding:16px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.glance .lbl{color:#8FE3C4}
.glance .big{color:#fff;font-size:60px}
.glance .big small{color:#8FE3C4}
.glance .rank{border-top:1px solid rgba(255,255,255,.16);margin-top:9px;padding-top:9px}
.glance .rankn{color:var(--gold);font-size:24px}
.glance .rankn small{color:#9FC7B5}
.sectionband{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  display:inline-block;margin:12px 0 10px}
.meter{border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05);border-radius:15px}
.mrow{padding:10px 4px}
.mr .tp{font-size:22px}
.wbn{border-radius:17px;border-width:2px;box-shadow:0 8px 22px rgba(19,148,172,.16)}
.wbn .opt{border-radius:12px;padding:14px;min-height:50px;transition:.14s;font-weight:600}
.wbn .opt:active{background:var(--water);color:#fff;border-color:var(--water)}
.wtrap{background:linear-gradient(160deg,var(--water-deep),#07323f);color:#eafcff;border-radius:17px;
  padding:18px;text-align:center;box-shadow:0 8px 24px rgba(12,86,106,.3)}
.wtrap .lbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:#8fe0ef}
.wtrap h3{font-family:var(--cond);font-size:25px;margin:5px 0 12px;color:#fff}
.wtrap .verdict{font-family:var(--cond);font-size:21px;font-weight:700;margin-top:4px}
.final-hero{border-radius:19px;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.lbrow{border:1px solid transparent}
.lbrow.win{border-color:var(--gold)}
.champ{box-shadow:0 4px 14px rgba(231,168,40,.16)}


/* ================= v31 ================= */
.impact{margin:0 0 12px}
.impact h1{font-family:var(--cond);font-size:27px;line-height:1.02;margin:0;color:var(--ink);letter-spacing:.01em}
.impact .sub{font-family:var(--cond);text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--muted);margin-top:3px}
.scorebox{background:linear-gradient(155deg,var(--turf-deep),#0b4030);color:#fff;border-radius:17px;
  padding:14px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:13px;
  box-shadow:0 8px 22px rgba(0,0,0,.18)}
.scorebox .n{font-family:var(--cond);font-size:54px;font-weight:700;line-height:.88}
.scorebox .n small{font-size:13px;color:#8FE3C4;display:block;letter-spacing:.1em;text-transform:uppercase}
.scorebox .r{text-align:right;font-family:var(--cond)}
.scorebox .r b{font-size:26px;color:var(--gold);display:block;line-height:1}
.scorebox .r span{font-size:10.5px;color:#9FC7B5;text-transform:uppercase;letter-spacing:.09em}
.tapwbn{background:linear-gradient(100deg,var(--gold),#f0be55);color:#0A3B2C;border:0;border-radius:15px;
  padding:15px;width:100%;text-align:center;cursor:pointer;box-shadow:0 6px 18px rgba(231,168,40,.32);margin-top:6px}
.tapwbn b{display:block;font-family:var(--cond);font-size:19px;letter-spacing:.01em}
.tapwbn span{font-size:12.5px;font-weight:600}

/* immersive WBN */
.wbnpage{text-align:center;padding:6px 0}
.wbnpage .kick{font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;color:var(--water-deep)}
.wbnpage h1{font-family:var(--cond);font-size:31px;margin:4px 0 2px;line-height:1}
.wbnpage .lede{font-size:12.5px;color:var(--muted);margin:0 auto 14px;max-width:290px;line-height:1.45}
.clock2{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:conic-gradient(var(--water) var(--pct,100%),#E2E9E4 0);position:relative}
.clock2:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--parch)}
.clock2 span{position:relative;font-family:var(--cond);font-size:33px;font-weight:700;color:var(--water-deep);line-height:1}
.clock2 span em{font-style:normal;display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.clock2.warn{background:conic-gradient(var(--penalty) var(--pct,100%),#E2E9E4 0)}
.clock2.warn span{color:var(--penalty)}
.wopts{display:flex;flex-direction:column;gap:9px}
.wopt{padding:15px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-size:15px;
  font-weight:600;cursor:pointer;text-align:left;min-height:52px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.wopt:active{background:var(--water);color:#fff;border-color:var(--water)}
.wopt.right{background:#E7F6EE;border-color:var(--good);color:#14663d}
.wopt.wrong{background:#FBEAE6;border-color:var(--penalty);color:var(--penalty)}
.wres{font-family:var(--cond);font-size:21px;margin:14px 0 4px}
.wres.good{color:var(--good)}.wres.miss{color:var(--muted)}

/* immersive Bear Trap */
.btpage{background:linear-gradient(165deg,#0C566A,#062731);border-radius:19px;padding:18px 15px 16px;color:#eafcff;
  box-shadow:0 10px 28px rgba(6,39,49,.4);position:relative;overflow:hidden}
.btpage:before{content:"";position:absolute;left:-30%;right:-30%;bottom:-40px;height:130px;
  background:radial-gradient(60% 100% at 50% 0,rgba(46,155,214,.45),transparent 70%)}
.btpage .kick{font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:#8fe0ef;position:relative}
.btpage h1{font-family:var(--cond);font-size:29px;margin:3px 0 1px;color:#fff;position:relative;line-height:1}
.btpage .hero{font-size:13px;color:#bfe9f5;margin-bottom:13px;position:relative}
.holemap{display:flex;gap:8px;position:relative;margin-bottom:13px}
.hm{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:13px;
  padding:9px 4px 10px;text-align:center;transition:.3s}
.hm .hn{font-family:var(--cond);font-size:10px;letter-spacing:.1em;color:#8fe0ef;text-transform:uppercase}
.hm .par{font-size:9px;color:#7fb9cc}
.hm .sc{font-family:var(--cond);font-size:31px;font-weight:700;line-height:1;margin-top:3px;color:#fff}
.hm .wave{font-size:15px;line-height:1;margin-top:1px}
.hm.pending{opacity:.42}
.hm.pending .sc{color:#6d9aab}
.hm.over{background:rgba(198,70,50,.3);border-color:#e08b76}
.hm.under{background:rgba(47,163,107,.28);border-color:#7fd9ab}
.hm.playing{animation:hmpulse 1.3s ease-in-out infinite}
@keyframes hmpulse{0%,100%{box-shadow:0 0 0 0 rgba(143,224,239,0)}50%{box-shadow:0 0 0 4px rgba(143,224,239,.3)}}
.btverdict{position:relative;background:rgba(0,0,0,.26);border-radius:13px;padding:12px;text-align:center}
.btverdict .vt{font-family:var(--cond);font-size:21px;font-weight:700;color:#fff;line-height:1.15}
.btverdict .vs{font-family:var(--cond);font-size:15px;margin-top:3px}
.btverdict .vs.good{color:#7fd9ab}.btverdict .vs.bad{color:#ff9b83}
.btrun{position:relative;text-align:center;font-family:var(--cond);font-size:13px;color:#bfe9f5;margin-bottom:10px}

/* 19th */
.nine h1{font-family:var(--cond);font-size:30px;margin:0 0 2px;line-height:1}
.resultrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;
  border-top:1px solid var(--line)}
.resultrow:first-child{border-top:0}
.resultrow .rl{font-size:13.5px;font-weight:600}
.resultrow .rd{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35}
.resultrow .rv{font-family:var(--cond);font-size:21px;font-weight:700;white-space:nowrap}
.resultrow .rv.good{color:var(--good)}.resultrow .rv.bad{color:var(--penalty)}.resultrow .rv.zero{color:var(--muted)}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.skillcell{background:#F7F4EA;border:1px solid var(--line);border-radius:10px;padding:8px}
.skillcell .sc1{font-family:var(--cond);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.skillcell .sc2{font-size:12.5px;font-weight:600;margin-top:1px}
.skillcell .sc3{font-family:var(--cond);font-size:12px;color:var(--water-deep)}

/* ================= v32 ================= */
/* 1. more visible back button */
.btn.ghost.sm{border-width:2px;border-color:var(--water);color:var(--water-deep);font-weight:700}
.btn.ghost.sm:before{content:"‹ ";font-size:18px;line-height:0}
/* 2. object-of-game strip on rules */
.objective{background:#EAF3EE;border:1px solid #cfe6da;border-radius:12px;padding:11px 13px;margin-bottom:13px;
  font-size:13px;line-height:1.45;color:#215741}
.objective b{font-family:var(--cond);font-size:14px;letter-spacing:.01em}
/* 7. bolder stack headlines */
.sectionband{background:var(--turf-deep);color:#fff;font-size:12px;letter-spacing:.06em;font-weight:700;
  border:0;padding:7px 14px}
.lead2{color:var(--gold)}
.champ .tt{font-family:var(--cond);text-transform:none;letter-spacing:.02em;font-size:12px}


/* ================= v33: team + tournament detail ================= */
.pdetail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.pdetail .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pdetail .pn{font-weight:600;font-size:14px}
.pdetail .pn .tag{font-family:var(--cond);font-size:9px;text-transform:uppercase;letter-spacing:.05em;
  padding:2px 6px;border-radius:5px;margin-left:5px}
.pdetail .pn .tag.sk{background:#FBF1DA;color:#8a6b12}.pdetail .pn .tag.bt{background:#E3F6FB;color:var(--water-deep)}
.pdetail .pn .tag.ld{background:#EAF3EE;color:#1F7A54}
.pdetail .ptp{font-family:var(--cond);font-size:22px;font-weight:700}
.pdetail .ptp.u{color:var(--good)}.pdetail .ptp.o{color:var(--penalty)}
.pdetail .pline{display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--muted)}
.pdetail .pline b{font-family:var(--cond);color:var(--ink);font-weight:700}
.twrap .sectionband{margin-top:14px}
.tteam{background:linear-gradient(120deg,#fff6e2,#fffdf7);border:1.5px solid var(--gold);border-radius:13px;padding:11px}
.tteam .tt2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:#8a6b12;margin-bottom:6px}
.tteam .tr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-top:1px solid #eaddb8}
.tteam .tr:first-of-type{border-top:0}
.tteam .tr b{font-family:var(--cond)}

    body{height:auto;min-height:100dvh;overflow:visible;position:static;display:block;background:var(--parch)}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;

        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;

            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);

  c.bear={d:tv,label:`${lastName(S.bear)} ${bm.trap===0?'made par':'went '+(bm.trap>0?'+':'')+bm.trap} on 15·16·17`,trap:[bm.holes[14],bm.holes[15],bm.holes[16]],tp:bm.trap};
  const sk=skinsAmong(S.five),right=sk.champ===S.skins;
  c.skins={d:right?-2:0,label:right?`${S.skins} won your Skins (${sk.counts[S.skins]})`:`${sk.champ} won the Skins — you had ${S.skins}`};
  let topd=0,tev=[];S.five.forEach(n=>{const t=byName[n].r4tp, tp=(t>0?'+':'')+t;
    if(t<=CUT3){topd-=LOW_ROUNDS.top3;tev.push(`${lastName(n)} shot ${tp} — one of the day’s low 3 (−${LOW_ROUNDS.top3})`);}
    else if(t<=CUTD){topd-=LOW_ROUNDS.inRange;tev.push(`${lastName(n)} shot ${tp} — inside the day’s low ${LOW_ROUNDS.depth} (−${LOW_ROUNDS.inRange})`);}});
  c.top={d:Math.round(topd*10)/10,label:tev.join(' · ')||'none of your five shot one of the day’s low rounds'};
  const err=Math.abs(S.guess-LOW_TP),lv=err>=GUESS.deadband?0:-(GUESS.exact-err*GUESS.perStroke);
  c.leader={d:Math.round(lv*10)/10,label:err===0?`Exact — low round ${LOW_TP}`:`Guessed ${S.guess>0?'+':''}${S.guess}; low round ${LOW_TP} (${err} off)`};
  {const aces=S.five.filter(nm=>P3.some(i=>byName[nm].holes[i]===1));
   c.ace={d:aces.length?-ACE*aces.length:0,
     label:aces.length?`${aces.map(lastName).join(', ')} holed out on a par 3!`
                      :'no ace on the card today — it pays 2.0 whenever it lands'};}
  {const sk=buildSkills(), tot=Math.round(sk.reduce((a,x)=>a+x.d,0)*10)/10;
   const hits=sk.filter(x=>x.n).map(x=>`${x.man} — ${x.cat}`);
   c.skills={d:tot,label:hits.join(' · ')||'none of your five cleared a Skills bar today'};}

}
const REVEAL={
  early:[], stretchTrap:['bear'], stretchDone:['bear','winner','skins','top','leader'],
  nineteenth:['bear','winner','skins','top','leader','skills']

function revealSet(){
  if(S.section==='early')return REVEAL.early;
  if(S.section==='stretch')return S.finalsResolved?REVEAL.stretchDone:REVEAL.stretchTrap;
  return REVEAL.nineteenth;
}
function youScore(){
  let off=0,on=0;const keys=revealSet();
  keys.forEach(k=>{const d=YC[k].d;if(d<0)off+=-d;else on+=d;});
  off+=S.wbnOff; // wbn live
  return Math.round((BASE-Math.min(off,CAP)+on)*10)/10;
}
function backdropScore(p,thr){let off=0,on=0;p.events.forEach(e=>{if(e.at<=thr){if(e.d<0)off+=-e.d;else on+=e.d;}});return Math.round((BASE-Math.min(off,CAP)+on)*10)/10;}
function threshold(){if(S.section==='early')return 0.5;if(S.section==='stretch')return S.finalsResolved?0.97:0.86;return 1.0;}

/* ===== live team meter ===== */
const MTEE=["11:20 AM","11:42 AM","12:05 PM","12:40 PM","1:52 PM"];
const MDELAY=[0,1,2,3,5];
function sumParK(k){let s=0;for(let i=0;i<k;i++)s+=PAR[i];return s;}
function toParThru(holes,k){let s=0;for(let i=0;i<k;i++)s+=holes[i];return s-sumParK(k);}
function skinsThrough(names,K){let c={},carry=1;names.forEach(n=>c[n]=0);
  for(let h=0;h<K;h++){let lo=1e9,w=[];names.forEach(n=>{const s=byName[n].holes[h];if(s<lo){lo=s;w=[n];}else if(s===lo)w.push(n);});
    if(w.length===1){c[w[0]]+=carry;carry=1;}else carry++;}
  let ch=null,mx=0;names.forEach(n=>{if(c[n]>mx){mx=c[n];ch=n;}});return ch;}
function meterThru(){if(S.section==='early')return ({m1:4,w1:4,m2:8,w2:8,m3:11})[S.earlyPhase];if(S.section==='stretch')return S.finalsResolved?18:16;return 18;}
function renderMeter(){
  const thru=meterThru();
  const effs=S.five.map((n,i)=>Math.max(0,Math.min(18,thru-MDELAY[i])));
  const minEff=Math.min.apply(null,effs);
  const skL=minEff>=1?skinsThrough(S.five,minEff):null;
  const rows=S.five.map((n,i)=>{
    const eff=effs[i],p=byName[n],isBear=n===S.bear;
    let right;
    if(eff===0){right=`<span class="tee">${MTEE[i]}</span>`;}
    else{const tp=toParThru(p.holes,eff),cls=tp<0?'under':tp>0?'over':'ev';
      right=`<span class="tp ${cls}">${tp===0?'E':(tp>0?'+'+tp:tp)}</span><span class="thru">${eff>=18?'F':'thru '+eff}</span>`;}
    let trapline='';
    if(isBear&&S.section!=='early'&&eff>=15){
      const shown=Math.min(eff,17)-14;
      trapline=`<div class="mtrap">${[0,1,2].map(j=>j<shown?`<span class="${p.holes[14+j]>PAR[14+j]?'w':''}">${p.holes[14+j]}</span>`:`<span class="pend">·</span>`).join('')}</div>`;
    }
    const tags=`${n===skL?'<span class="mtag skins">Skins ▲</span>':''}${isBear?'<span class="mtag trap">Bear Trap</span>':''}`;
    const hot=(isBear&&S.section!=='early'&&eff>=15)?'trapon':'';
    return `<div class="mrow ${hot}"><div class="mn">${n}${tags}${trapline}</div><div class="mr">${right}</div></div>`;
  }).join('');
  return `<div class="meter"><div class="mhd">Your five · live on the course</div>${rows}</div>`;
}

/* ===== runtime QR: always points at wherever this page is served from ===== */
function makeQR(text,px){
  try{
    var q=qrcode(0,'M'); q.addData(text); q.make();
    var n=q.getModuleCount(), cell=Math.max(2,Math.floor(px/(n+8))), quiet=4*cell, size=n*cell+quiet*2;
    var c=document.createElement('canvas'); c.width=c.height=size;
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,size,size); x.fillStyle='#0A3B2C';
    for(var r=0;r<n;r++)for(var col=0;col<n;col++) if(q.isDark(r,col)) x.fillRect(quiet+col*cell,quiet+r*cell,cell,cell);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
function liveURL(){
  var p=location.protocol;
  if(p!=='http:'&&p!=='https:') return null;      // file:// can't be scanned
  return location.href.split('#')[0];
}

const STEP_NAMES=['Team name','Your leader','The number','Your five','The jobs'];
function steps2(){
  return '<div class="steps2">'+[0,1,2,3,4].map(i=>
    `<span class="st2 ${i<S.regStep?'done':i===S.regStep?'on':''}"></span>`).join('')+'</div>'+
    `<div class="steplbl">Step ${S.regStep+1} of 5 · ${STEP_NAMES[S.regStep]}</div>`;
}
function shead(kicker,title,sub){
  return `<div class="shead rise">${kicker?`<div class="st">${kicker}</div>`:''}<h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>`;
}

regName=function(){
  body().innerHTML=steps2()+shead('Get started','Name your team','Ninety seconds of picks, then follow the round. That’s the whole game.')+
    `<input type="text" id="tm" maxlength="26" placeholder="e.g. Bear Trap Bandits" value="${S.team}">
     <div class="btnrow"><button class="btn primary" id="nx" ${S.team.trim()?'':'disabled'}>Next — pick your Low Man</button></div>`;
  const t=$("#tm"); t.oninput=()=>{S.team=t.value;$("#nx").disabled=!t.value.trim();};
  t.onkeydown=e=>{if(e.key==='Enter'&&S.team.trim())nextReg();};
  $("#nx").onclick=nextReg;
};

function chipList(arr,g,sel,handler){
  return `<div class="chips">${arr.map(p=>{
    const on=(typeof sel==='function')?sel(p.name):sel===p.name;
    const lock=p.name===S.leader && handler==='team';
    const full=handler==='team' && !on && remaining()[g]<=0;
    return `<button class="chip ${lock?'lock':''}" data-n="${p.name}" aria-pressed="${on}" ${lock||full?'disabled':''}>
      <span class="gb">${g}</span>${p.name}${lock?' ★':''}</button>`;}).join('')}</div>`;
}

regLeader=function(){
  const grp=(list,g,pay,note)=>`<div class="ghd"><span>Group ${g} · ${note}</span><span class="p">${pay}</span></div>`+
    chipList(list,g,S.leader,'leader');

/* --- 9. immersive Bear Trap --- */
function trapPage(){
  const bm=byName[S.bear], sc=[bm.holes[14],bm.holes[15],bm.holes[16]], pars=[PAR[14],PAR[15],PAR[16]];
  const names=['15','16','17'], step=S.trapStep;
  const cells=sc.map((s,i)=>{
    if(i>=step) return `<div class="hm pending ${i===step?'playing':''}"><div class="hn">Hole ${names[i]}</div><div class="par">par ${pars[i]}</div><div class="sc">–</div></div>`;
    const rel=s-pars[i], cls=rel>0?'over':rel<0?'under':'';
    const mark=rel>0?'💦':rel<0?'🐦':'';
    return `<div class="hm ${cls}"><div class="hn">Hole ${names[i]}</div><div class="par">par ${pars[i]}</div><div class="sc">${s}</div><div class="wave">${mark}</div></div>`;
  }).join('');
  let run=0; for(let i=0;i<step;i++) run+=sc[i]-pars[i];
  const done=step>=3;
  let verdict='';
  if(done){
    const d=bear(bm.trap), tp=bm.trap;
    if(tp>0) verdict=`<div class="btverdict"><div class="vt">+${tp} — You got clawed!</div><div class="vs bad">+${d.toFixed(1)} strokes</div></div>`;
    else if(tp===0) verdict=`<div class="btverdict"><div class="vt">E — You are safe!</div><div class="vs good">−1.0 strokes</div></div>`;
    else verdict=`<div class="btverdict"><div class="vt">${tp} — You tamed the Bear!</div><div class="vs good">−${(-d).toFixed(1)} strokes</div></div>`;
  }
  const running = step===0?'Standing on the 15th tee':(done?'':'Through '+names[step-1]+': '+(run>0?'+'+run:run===0?'even':run));
  return `<div class="btpage">
      <div class="kick">Bear Trap Snare · 15 · 16 · 17</div>
      <h1>${S.bear}</h1><div class="hero">Your Bear Trap hero takes on the water</div>
      ${running?`<div class="btrun">${running}</div>`:''}
      <div class="holemap">${cells}</div>
      ${verdict}
    </div>
    <button class="btn primary" id="${done?'toPost':'trapNext'}" style="margin-top:14px">${done?('Back to '+TEAM()+' Live Scoreboard'):('▶ Play hole '+names[step])}</button>`;
}

function strokeVal(v){
  const s=Math.abs(v)%1===0 ? (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(0) : (v>0?'+':'')+v.toFixed(1);
  return s+' strokes';
}
function valTxt(raw){
  // raw like '−2.0', '−3.0 / +1.5', '−2 to −5', '−0.5 / −1.0', '−1.5 each'
  return raw
    .replace(/(?<![\d.])(\d+)\.0(?![\d])/g,'$1')      // 2.0 -> 2, keep 1.5

}
