/* 6. Bear Trap hole map — make the layout unmistakable with a mini routing drawing */
function trapDiagram(step,sc,pars){
  /* A stylised map of PGA National's 15-16-17: par 3 over water, par 4 with water
     down the right, par 3 over water again. Holes fill in as they are played. */
  const C={rough:'#0d3d2c',fair:'#1c6e4c',green:'#3fbe84',water:'#0C566A',
           wave:'#1394AC',sand:'#e0d2ac',tee:'#E7A828',line:'#eafcff'};
  const status=i=>{ if(i>=step) return null; return sc[i]-pars[i]; };
  const dotFill=r=>r===null?'#2a4a3e':r>0?'#C4402B':r<0?'#1F9257':'#E7A828';

  function panel(i,x){
    const r=status(i), played=i<step, active=(i===step);
    const shapes=[
      /* 15 — par 3, green sits beyond water, bunker right */
      `<path d="M8 74 Q30 62 52 70 T96 66 L96 96 L8 96 Z" fill="${C.water}"/>
       <path d="M8 74 Q30 62 52 70 T96 66" stroke="${C.wave}" stroke-width="1.6" fill="none" opacity=".85"/>
       <ellipse cx="52" cy="42" rx="30" ry="19" fill="${C.green}"/>
       <ellipse cx="82" cy="52" rx="9" ry="6" fill="${C.sand}"/>`,
      /* 16 — par 4, fairway bends right, water all down the right side */
      `<path d="M70 8 Q86 44 78 96 L96 96 L96 8 Z" fill="${C.water}"/>
       <path d="M70 8 Q86 44 78 96" stroke="${C.wave}" stroke-width="1.6" fill="none" opacity=".85"/>
       <path d="M22 92 Q26 58 42 40 Q54 26 62 20 L74 30 Q60 42 50 58 Q38 76 36 94 Z" fill="${C.fair}"/>
       <ellipse cx="46" cy="26" rx="22" ry="14" fill="${C.green}"/>
       <ellipse cx="22" cy="40" rx="8" ry="5.5" fill="${C.sand}"/>`,
      /* 17 — par 3, water wraps the front and left of the green */
      `<path d="M8 58 Q34 46 58 60 Q76 70 96 64 L96 96 L8 96 Z" fill="${C.water}"/>
       <path d="M8 58 Q34 46 58 60 Q76 70 96 64" stroke="${C.wave}" stroke-width="1.6" fill="none" opacity=".85"/>
       <ellipse cx="58" cy="34" rx="27" ry="17" fill="${C.green}"/>
       <ellipse cx="26" cy="30" rx="8" ry="5.5" fill="${C.sand}"/>`
    ][i];
    const pin=[[52,42],[46,26],[58,34]][i];
    const tee=[[52,90],[26,92],[50,90]][i];
    return `<g transform="translate(${x},0)">
      <rect x="4" y="4" width="96" height="128" rx="9" fill="#08281d"
        stroke="${active?C.tee:'#17513c'}" stroke-width="${active?2:1}"/>
      <clipPath id="cp${i}"><rect x="4" y="4" width="96" height="94" rx="9"/></clipPath>
      <rect x="4" y="4" width="96" height="94" rx="9" fill="${C.rough}"/>
      <g clip-path="url(#cp${i})">${shapes}</g>
      <rect x="${tee[0]-5}" y="${tee[1]-3}" width="10" height="4" rx="1.6" fill="${C.tee}"/>
      <path d="M${pin[0]} ${pin[1]-14} L${pin[0]} ${pin[1]+2}" stroke="${C.line}" stroke-width="1.4"/>
      <path d="M${pin[0]} ${pin[1]-14} L${pin[0]+9} ${pin[1]-10.5} L${pin[0]} ${pin[1]-7} Z" fill="#C4402B"/>
      <path d="M${tee[0]} ${tee[1]-4} Q${(tee[0]+pin[0])/2-8} ${(tee[1]+pin[1])/2} ${pin[0]} ${pin[1]+2}"
        stroke="${C.line}" stroke-width="1.2" fill="none" stroke-dasharray="3 3" opacity=".55"/>
      <rect x="8" y="8" width="30" height="15" rx="4" fill="#08281d" opacity=".82"/>
      <text x="23" y="19" fill="#bfe9f5" font-size="9.5" font-family="Arial" font-weight="bold"
        text-anchor="middle">${['15','16','17'][i]}</text>
      <rect x="62" y="8" width="34" height="15" rx="4" fill="#08281d" opacity=".82"/>
      <text x="79" y="19" fill="#8fbfae" font-size="8" font-family="Arial" text-anchor="middle">par ${pars[i]}</text>
      <line x1="4" y1="98" x2="100" y2="98" stroke="#17513c" stroke-width="1"/>
      ${played?`<circle cx="36" cy="115" r="12" fill="${dotFill(r)}" stroke="${C.line}" stroke-width="1.4"/>
        <text x="36" y="120" fill="#fff" font-size="12.5" font-weight="bold" font-family="Arial"
          text-anchor="middle">${sc[i]}</text>
        <text x="70" y="120" fill="${r>0?'#e08a76':r<0?'#7fd9ab':'#d9c98a'}" font-size="12"
          font-weight="bold" font-family="Arial" text-anchor="middle">${r>0?'+'+r:r<0?r:'par'}</text>`
       :`<text x="52" y="120" fill="${active?'#E7A828':'#3d6154'}" font-size="10"
          font-family="Arial" text-anchor="middle">${active?'playing…':'to come'}</text>`}
    </g>`;
  }
  const running = step>0 ? sc.slice(0,step).reduce((a,v,i)=>a+v-pars[i],0) : null;
  const rt = running===null?'':`<text x="156" y="150" fill="#bfe9f5" font-size="10.5"
      font-family="Arial" text-anchor="middle">through ${step}: ${running>0?'+'+running:running===0?'even':running}</text>`;
  return `<svg viewBox="0 0 312 ${running===null?140:156}" style="width:100%;height:auto;display:block;margin-bottom:10px">
    ${panel(0,0)}${panel(1,104)}${panel(2,208)}${rt}</svg>`;
}
trapPage=function(){
  const bm=byName[S.bear], sc=[bm.holes[14],bm.holes[15],bm.holes[16]], pars=[PAR[14],PAR[15],PAR[16]];
  const names=['15','16','17'], step=S.trapStep;
  const cells=sc.map((s,i)=>{
    if(i>=step) return `<div class="hm pending ${i===step?'playing':''}"><div class="hn">Hole ${names[i]}</div><div class="par">par ${pars[i]}</div><div class="sc">–</div></div>`;
    const rel=s-pars[i], cls=rel>0?'over':rel<0?'under':'';
    const mark=rel>0?'💦':rel<0?'🐦':'';
    return `<div class="hm ${cls}"><div class="hn">Hole ${names[i]}</div><div class="par">par ${pars[i]}</div><div class="sc">${s}</div><div class="wave">${mark}</div></div>`;
  }).join('');
  let run=0; for(let i=0;i<step;i++) run+=sc[i]-pars[i];

  }
  const running = step===0?'Standing on the 15th tee':(done?'':'Through '+names[step-1]+': '+(run>0?'+'+run:run===0?'even':run));

};

function playerDetail(){
  return S.five.map(n=>{
    const p=byName[n], tp=p.r4tp, cls=tp<0?'u':tp>0?'o':'';
    const front=p.holes.slice(0,9).reduce((a,b)=>a+b,0)-PAR.slice(0,9).reduce((a,b)=>a+b,0);
    const back=p.holes.slice(9).reduce((a,b)=>a+b,0)-PAR.slice(9).reduce((a,b)=>a+b,0);
    let bird=0,eag=0; p.holes.forEach((s,i)=>{const r=s-PAR[i]; if(r===-1)bird++; if(r<=-2)eag++;});
    const tags=`${n===S.leader?'<span class="tag ld">Leader</span>':''}${n===S.skins?'<span class="tag sk">Skins</span>':''}${n===S.bear?'<span class="tag bt">Bear Trap</span>':''}`;
    const rel=v=>v>0?'+'+v:v===0?'E':v;
    return `<div class="pdetail"><div class="ph"><div class="pn">${n}${tags}</div>
      <div class="ptp ${cls}">${tp>0?'+'+tp:tp===0?'E':tp}</div></div>
      <div class="pline"><span>Front <b>${rel(front)}</b></span><span>Back <b>${rel(back)}</b></span>
      <span>Birdies <b>${bird}</b></span>${eag?`<span>Eagles <b>${eag}</b></span>`:''}<span>Finish <b>${ordn(p.pos)}</b></span></div></div>`;
  }).join('');
}
teamTab=function(){
  const rv=revealSet(), sk=buildSkills();
  const CN={winner:['Who Goes Low?','who shoots the best score'],leader:['Best-score guess','how close you were'],
    skins:['Virtual Skins Game','your man wins the skins game'],bear:['Bear Trap Snare','your man over 15·16·17'],
    top:['Low Rounds','your five vs the day’s best scores']};
  let h=impact(TEAM()+' Live Scorecard')+scorebox()+renderMeter()+
    `<div class="sectionband">Your five today</div>`+playerDetail()+
    `<div class="sectionband">Your challenges</div>
     <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 12px">`;
  ['winner','leader','skins','bear','top'].forEach(k=>{
    const on=rv.includes(k),c=YC[k];
    h+=`<div class="resultrow"><div><div class="rl">${CN[k][0]}</div><div class="rd">${on?c.label:CN[k][1]}</div></div>
      <div class="rv ${!on?'zero':c.d<0?'good':c.d>0?'bad':'zero'}">${on?(c.d===0?'—':fmt(c.d)):'· · ·'}</div></div>`;
  });
  h+=`<div class="resultrow"><div><div class="rl">Who Birdies Next?</div><div class="rd">live birdie calls</div></div>
      <div class="rv ${S.wbnOff>0?'good':'zero'}">${S.wbnOff>0?fmt(-S.wbnOff):'· · ·'}</div></div>
      <div class="resultrow"><div><div class="rl">Skills</div><div class="rd">each of your five who clears a bar</div></div>
      <div class="rv ${rv.includes('skills')?'good':'zero'}">${rv.includes('skills')?fmt(Math.round(sk.reduce((a,x)=>a+x.d,0)*10)/10):'· · ·'}</div></div>
      <div class="resultrow"><div><div class="rl">Ace</div><div class="rd">${rv.includes('ace')?YC.ace.label:'any of your five holes out on a par 3'}</div></div>
      <div class="rv ${rv.includes('ace')&&YC.ace.d<0?'good':'zero'}">${rv.includes('ace')?(YC.ace.d===0?'—':fmt(YC.ace.d)):'· · ·'}</div></div>
    </div>`;
  return h;
}

/* 9. loaded Tournament tab */
function bestFieldTeam(){
  // ideal 1-A/2-B/2-C by lowest r4 to-par
  const pick=(arr,k)=>[...arr].sort((a,b)=>a.r4tp-b.r4tp).slice(0,k);
  return [...pick(A,1),...pick(B,2),...pick(Cs,2)];
}
boardTab=function(rows,rank){
  // day golf leaders
  const golf=[...CARD].sort((a,b)=>a.r4tp-b.r4tp);
  // bear trap leaders
  const trap=[...CARD].sort((a,b)=>a.trap-b.trap).slice(0,5);
  // wbn birdie/eagle makers (front-nine sample from fixture)
  const makers=[]; CARD.forEach(p=>{for(let i=0;i<18;i++){const r=p.holes[i]-PAR[i];
    if(r<=-2){makers.push([p.name,i+1,'eagle']);break;} }});
  CARD.forEach(p=>{if(makers.find(m=>m[0]===p.name))return;
    for(let i=0;i<18;i++){if(p.holes[i]-PAR[i]===-1){makers.push([p.name,i+1,'birdie']);break;}}});
  // best virtual-skins men (most holes won among the ideal team as a stand-in: use fewest-putts proxy = lowest r4)
  const skinsMen=golf.slice(0,5);
  const ideal=bestFieldTeam();
  const idealTotal=ideal.reduce((a,p)=>a+p.r4tp,0);
  const row=(pos,name,val,you)=>`<div class="lbrow ${you?'you':''} ${pos===1?'win':''}">
    <div class="p"><span class="${pos===1?'lead2':''}">${pos}</span></div><div class="nm">${name}</div><div class="sc">${val}</div></div>`;
  return impact('Leaderboards')+adRail(SPONSOR.slots[3])+`<div class="twrap">
    <div class="sectionband">Beat the Crowd · today</div>
    ${rows.map((r,i)=>row(i+1,r.name+(r.pick?` <span class="s" style="display:block;font-size:11px;color:var(--muted)">${r.pick}</span>`:''),r.score.toFixed(1),r.you)).join('')}

    <div class="sectionband">Cognizant · Sunday leaders</div>
    <div class="miniList">${golf.slice(0,6).map((p,i)=>row(i+1,p.name+` <span class="s" style="display:block;font-size:11px;color:var(--muted)">Grp ${p.group}</span>`,p.r4tp>0?'+'+p.r4tp:p.r4tp,p.name===S.leader)).join('')}</div>

    <div class="sectionband">Bear Trap · today’s best (15·16·17)</div>
    <div class="miniList">${trap.map((p,i)=>row(i+1,p.name,p.trap>0?'+'+p.trap:p.trap===0?'E':p.trap)).join('')}</div>

    <div class="sectionband">Who Birdies Next? · today’s makers</div>
    <div class="miniList">${makers.slice(0,6).map((m,i)=>`<div class="lbrow"><div class="p">${m[2]==='eagle'?'🦅':'🐦'}</div>
      <div class="nm">${m[0]}<span class="s" style="display:block;font-size:11px;color:var(--muted)">${m[2]} · hole ${m[1]}</span></div></div>`).join('')}</div>

    <div class="sectionband">Best Virtual Skins men today</div>
    <div class="miniList">${skinsMen.map((p,i)=>row(i+1,p.name,p.r4tp>0?'+'+p.r4tp:p.r4tp)).join('')}</div>

    <div class="sectionband">Skills · who cleared a bar today</div>
    <div class="miniList">${SKILL_CATS.map((c,i)=>{
      const men=CARD.filter(p=>skillsFor(p.name)[SKILL_KEYS[i]]).map(p=>p.name);
      return `<div class="lbrow"><div class="p">${['🎯','🟢','⛳','🏌️'][i]}</div>
       <div class="nm">${men.length?men.join(', '):'<span style="color:var(--muted)">nobody today</span>'}<span class="s" style="display:block;font-size:11px;color:var(--muted)">${c[0]} · ${c[1]}</span></div></div>`;}).join('')}</div>

    <div class="sectionband">Beat the Crowd Team of the Day</div>
    <div class="tteam"><div class="tt2">Today’s ideal 1·A / 2·B / 2·C team — hindsight only</div>
      ${ideal.map(p=>`<div class="tr"><span>${p.name} <span style="color:var(--muted)">· Grp ${p.group}</span></span><b>${p.r4tp>0?'+'+p.r4tp:p.r4tp}</b></div>`).join('')}
      <div class="tr" style="border-top:2px solid var(--gold)"><span><b>Team total</b></span><b>${idealTotal>0?'+'+idealTotal:idealTotal}</b></div></div>
    <div class="demoflag">Skills and the Bear Trap are scored from the real hole-by-hole card. The Virtual Skins list is a stand-in — skins is played among your own five.</div>
  </div>`;
}

render();
</script>
